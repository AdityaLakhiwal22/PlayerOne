{% extends 'base.html' %}
{% block title %}Forgot Password — Player One{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card p-4">
            <h2 style="color:#00ff87;" class="mb-1 text-center">🔑 Forgot Password?</h2>
            <p style="color:#aaa;" class="text-center mb-4">Enter your email and we'll send you a reset link.</p>
            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label">Email Address</label>
                    <input type="email" name="email" class="form-control" placeholder="youremail@gmail.com" required>
                </div>
                <button type="submit" class="btn btn-p1 w-100">Send Reset Link 📧</button>
            </form>
            <p class="text-center mt-3">
                <a href="{% url 'login' %}" style="color:#00ff87;">← Back to Login</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
