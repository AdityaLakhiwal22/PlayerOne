{% extends 'base.html' %}
{% block title %}Forgot Password — PlayerOne{% endblock %}

{% block content %}
<style>
.search-card .form-control, .search-card .form-select {
  width:100%;background:var(--dark3);border:1px solid var(--border);color:var(--text);
  padding:.65rem 1rem;border-radius:2px;font-family:'DM Sans',sans-serif;font-size:.9rem;
  outline:none;transition:border-color .2s;margin-top:.25rem;
  box-sizing:border-box;
}
.search-card .form-control:focus, .search-card .form-select:focus{border-color:var(--lime)}
</style>
<div style="max-width:420px;margin:0 auto;padding:5rem 1.5rem">
  <div class="search-card">
    <div class="modal-title">FORGOT PASSWORD?</div>
    <div class="modal-sub">Enter your email and we'll send you a reset link.</div>
    <form method="post">
      {% csrf_token %}
      <div class="form-group">
        <label class="form-label">Email Address</label>
        {{ form.email }}
      </div>
      <button type="submit" class="modal-submit">SEND RESET LINK →</button>
    </form>
    <div style="text-align:center;margin-top:1.25rem">
      <a href="{% url 'login' %}" style="color:var(--text2);font-size:.78rem;font-family:'DM Mono',monospace">← Back to Login</a>
    </div>
  </div>
</div>
{% endblock %}
