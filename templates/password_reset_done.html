{% extends 'base.html' %}
{% block title %}Check Your Email — PlayerOne{% endblock %}

{% block content %}
<div style="max-width:420px;margin:0 auto;padding:5rem 1.5rem">
  <div class="search-card" style="text-align:center">
    <div style="font-size:3rem;margin-bottom:.75rem">📧</div>
    <div class="modal-title">CHECK YOUR EMAIL</div>
    <p style="color:var(--text2);font-size:.88rem;line-height:1.7;margin:1rem 0 1.5rem">
      We've sent a password reset link to your email. Check your inbox — it should arrive in a few minutes.
    </p>
    <p style="color:var(--muted);font-size:.72rem;font-family:'DM Mono',monospace;letter-spacing:.08em;text-transform:uppercase;margin-bottom:1.5rem">
      Don't see it? Check your spam folder.
    </p>
    <a href="{% url 'login' %}" class="btn-ghost" style="text-decoration:none;width:100%;justify-content:center">← Back to Login</a>
  </div>
</div>
{% endblock %}
