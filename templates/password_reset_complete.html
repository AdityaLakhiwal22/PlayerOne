{% extends 'base.html' %}
{% block title %}Password Reset Complete — PlayerOne{% endblock %}

{% block content %}
<div style="max-width:420px;margin:0 auto;padding:5rem 1.5rem">
  <div class="search-card" style="text-align:center">
    <div style="font-size:3rem;margin-bottom:.75rem">✅</div>
    <div class="modal-title" style="color:var(--lime)">PASSWORD RESET!</div>
    <p style="color:var(--text2);font-size:.88rem;line-height:1.7;margin:1rem 0 1.5rem">
      Your password has been set successfully. You can now login with your new password.
    </p>
    <a href="{% url 'login' %}" class="btn-p1" style="text-decoration:none;width:100%;justify-content:center">LOGIN NOW →</a>
  </div>
</div>
{% endblock %}
