{% extends 'base.html' %}
{% block title %}Login — Player One{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card p-4">
            <h2 style="color:#00ff87;" class="mb-4 text-center">🔑 Login</h2>
            <form method="post">
                {% csrf_token %}
                {% for field in form %}
                <div class="mb-3">
                    <label class="form-label">{{ field.label }}</label>
                    {{ field }}
                </div>
                {% endfor %}
                <button type="submit" class="btn btn-p1 w-100 mt-2">Login</button>
            </form>
            <p class="text-center text-muted mt-3">
                No account? <a href="{% url 'register' %}" style="color:#00ff87;">Register here</a> · 
                <a href="{% url 'password_reset' %}" style="color:#888;">Forgot password?</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
