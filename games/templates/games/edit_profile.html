{% extends 'base.html' %}
{% block title %}Edit Profile — PlayerOne{% endblock %}

{% block content %}<div style="max-width:560px;margin:0 auto;padding:3rem">
  <div class="section-eyebrow">
    <a href="{% url 'player_profile' user.username %}" style="color:var(--lime)">Profile</a> / Edit
  </div>
  <div class="section-title" style="margin-bottom:1.5rem">✏️ EDIT <span class="dim">PROFILE</span></div>

  <div class="search-card">
    <form method="post" enctype="multipart/form-data">
      {% csrf_token %}
      {% for field in form %}
      <div class="form-group">
        <label class="form-label">{{ field.label }}</label>
        {{ field }}
        {% if field.help_text %}
        <p style="color:var(--muted);font-size:.72rem;margin-top:.3rem">{{ field.help_text }}</p>
        {% endif %}
      </div>
      {% endfor %}

      <button type="submit" class="modal-submit">💾 SAVE PROFILE</button>
      <a href="{% url 'player_profile' user.username %}" class="btn-ghost" style="width:100%;justify-content:center;margin-top:.75rem;text-decoration:none">Cancel</a>
    </form>
  </div>
</div>
{% endblock %}
