{% extends 'base.html' %}
{% block title %}Edit Profile — Player One{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card p-4">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2 style="color:#00ff87;" class="mb-0">👤 Edit Profile</h2>
                <a href="{% url 'player_profile' user.username %}" class="btn btn-outline-secondary btn-sm">← Back to Profile</a>
            </div>
            <form method="post" enctype="multipart/form-data">
                {% csrf_token %}
                {% for field in form %}
                <div class="mb-3">
                    <label class="form-label">{{ field.label }}</label>
                    {{ field }}
                    {% if field.help_text %}<div class="form-text text-muted">{{ field.help_text }}</div>{% endif %}
                </div>
                {% endfor %}
                <button type="submit" class="btn btn-p1 w-100">Save Profile 💾</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
