{% extends 'base.html' %}
{% block title %}Rate {{ rated_user.username }} — PlayerOne{% endblock %}

{% block content %}
<div style="max-width:480px;margin:0 auto;padding:4rem 1.5rem">
  <div class="search-card" style="text-align:center">
    <div class="modal-title">⭐ RATE PLAYER</div>
    <p style="color:var(--text2);font-size:.85rem;margin-bottom:1.5rem">
      How was your experience playing with<br>
      <strong style="color:var(--text)">{{ rated_user.username }}</strong>
      in <strong style="color:var(--text)">{{ post.title }}</strong>?
    </p>

    <form method="post">
      {% csrf_token %}
      <div style="margin-bottom:1.5rem">
        <div class="d-flex justify-content-center gap-2" id="stars" style="font-size:2.5rem">
          {% for i in "12345" %}
          <span class="star" data-value="{{ i }}" style="cursor:pointer;opacity:1">⭐</span>
          {% endfor %}
        </div>
        <input type="hidden" name="score" id="score-input" value="5">
      </div>

      <div class="form-group" style="text-align:left">
        <label class="form-label">Comment (optional)</label>
        <input type="text" name="comment" class="form-input" placeholder="Great teammate, very punctual...">
      </div>

      <button type="submit" class="modal-submit">SUBMIT RATING →</button>
      <a href="{% url 'post_detail' post.pk %}" class="btn-ghost" style="width:100%;justify-content:center;margin-top:.75rem;text-decoration:none">Cancel</a>
    </form>
  </div>
</div>

<script>
const stars = document.querySelectorAll('.star');
let selected = 5;
stars.forEach(s => s.style.opacity = '1');
stars.forEach(star => {
  star.addEventListener('click', () => {
    selected = parseInt(star.dataset.value);
    document.getElementById('score-input').value = selected;
    stars.forEach(s => { s.style.opacity = parseInt(s.dataset.value) <= selected ? '1' : '0.3'; });
  });
  star.addEventListener('mouseover', () => {
    const val = parseInt(star.dataset.value);
    stars.forEach(s => { s.style.opacity = parseInt(s.dataset.value) <= val ? '1' : '0.3'; });
  });
  star.addEventListener('mouseout', () => {
    stars.forEach(s => { s.style.opacity = parseInt(s.dataset.value) <= selected ? '1' : '0.3'; });
  });
});
</script>
{% endblock %}
