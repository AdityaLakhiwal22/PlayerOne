{% extends 'base.html' %}
{% block title %}Delete Post — Player One{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div style="border:1px solid #ff4444;padding:40px;text-align:center;">
            <p style="font-size:3rem;margin:0;">🗑️</p>
            <h2 style="font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:2.5rem;text-transform:uppercase;letter-spacing:2px;color:#ff4444;margin:16px 0 8px 0;">
                Delete Post?
            </h2>
            <p style="color:#888;margin:0 0 8px 0;">Are you sure you want to delete:</p>
            <p style="font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:1.3rem;text-transform:uppercase;letter-spacing:1px;color:#fff;margin:0 0 16px 0;">
                {{ post.title }}
            </p>
            <p style="color:#444;font-size:0.75rem;letter-spacing:1px;text-transform:uppercase;margin-bottom:24px;">
                This cannot be undone
            </p>
            <div class="d-flex gap-2 justify-content-center">
                <form method="post">
                    {% csrf_token %}
                    <button type="submit" class="btn px-4" style="background:#ff4444;color:#fff;border-radius:0;font-family:'Barlow Condensed',sans-serif;font-weight:800;letter-spacing:2px;text-transform:uppercase;padding:12px 24px;border:none;">
                        Yes, Delete
                    </button>
                </form>
                <a href="{% url 'post_detail' post.pk %}" class="btn btn-p1-outline px-4" style="padding:12px 24px;letter-spacing:2px;">
                    Cancel
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
