{% extends 'base.html' %}
{% block title %}Delete Post — PlayerOne{% endblock %}

{% block content %}
<div style="max-width:460px;margin:0 auto;padding:5rem 1.5rem">
  <div class="search-card" style="text-align:center;border-color:rgba(255,68,68,.3)">
    <div style="font-size:2.5rem">🗑️</div>
    <div class="modal-title" style="color:var(--red);margin-top:.5rem">DELETE POST?</div>
    <p style="color:var(--text2);margin-bottom:.25rem">Are you sure you want to delete:</p>
    <p style="font-family:'Bebas Neue',sans-serif;font-size:1.4rem;letter-spacing:.04em;color:var(--text);margin-bottom:1rem">{{ post.title }}</p>
    <p style="color:var(--muted);font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;margin-bottom:1.5rem">This cannot be undone</p>

    <div style="display:flex;gap:.75rem;justify-content:center">
      <form method="post">
        {% csrf_token %}
        <button type="submit" style="background:var(--red);color:#fff;border:none;padding:.75rem 1.75rem;border-radius:2px;font-family:'Bebas Neue',sans-serif;font-size:1.1rem;letter-spacing:.06em">Yes, Delete</button>
      </form>
      <a href="{% url 'post_detail' post.pk %}" class="btn-p1-outline" style="text-decoration:none">Cancel</a>
    </div>
  </div>
</div>
{% endblock %}
